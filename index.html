<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alquileres</title>
  <meta name="description" content="Gestión de pisos de alquiler: cobros, impagos, contratos, gastos, hipotecas, rentabilidad y fiscalidad.">
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Alquileres">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/escena.css">
</head>
<body>
  <div id="escena" aria-hidden="true"></div>
  <div class="shell">
    <aside class="side" aria-label="Navegación">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg></span>
        <span>Alquileres</span>
      </div>
      <nav id="sidenav"></nav>
      <div class="side-foot">Datos guardados en este dispositivo</div>
    </aside>
    <header class="topbar" aria-hidden="true"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg></span><span>Alquileres</span></header>
    <button id="hud" class="hud" type="button" data-action="ascensor" aria-label="Ascensor: ir a otra planta" title="Abrir el ascensor">
      <span class="hud-arrows" aria-hidden="true"><i class="up"></i><i class="down"></i></span>
      <span class="hud-num" aria-hidden="true"></span><span class="hud-txt"><span class="hud-nom"></span><span class="hud-planta"></span></span>
    </button>
    <main id="main" tabindex="-1"></main>
    <nav id="tabbar" aria-label="Navegación"></nav>
  </div>
  <dialog id="dialogo"></dialog>
  <dialog id="confirmacion" class="dlg-confirm"></dialog>
  <dialog id="visor" class="visor"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Esta aplicación necesita JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
